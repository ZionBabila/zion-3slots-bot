<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>מקליד C# ל-Unity</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="topbar">
    <h1>⌨️ מקליד C# ל-Unity</h1>
    <div class="stats-bar">
      <div class="stat"><span id="stat-wpm">0</span><label>מילים/דקה</label></div>
      <div class="stat"><span id="stat-acc">100%</span><label>דיוק</label></div>
      <div class="stat"><span id="stat-errors">0</span><label>שגיאות</label></div>
      <div class="stat"><span id="stat-progress">0%</span><label>התקדמות</label></div>
    </div>
  </header>

  <main class="layout">
    <aside class="sidebar" id="lesson-list"></aside>

    <section class="main-panel">
      <div class="lesson-header">
        <div class="lesson-header-top">
          <h2 id="lesson-title">בחר שיעור</h2>
          <button id="btn-learn-mode" class="btn-learn-mode">📖 מצב קריאה</button>
        </div>
        <p id="lesson-desc"></p>
      </div>

      <div class="code-stage">
        <pre id="code-display" dir="ltr"></pre>
        <textarea id="hidden-input" dir="ltr" autocomplete="off" autocapitalize="off" spellcheck="false"></textarea>
      </div>

      <div id="learn-display" class="learn-display"></div>

      <div class="result-panel" id="result-panel" hidden>
        <h3>🎉 שיעור הושלם!</h3>
        <p id="result-text"></p>
        <button id="btn-next">לשיעור הבא ➜</button>
        <button id="btn-retry">נסה שוב</button>
      </div>

      <div class="keyboard-panel">
        <div class="keyboard-toolbar">
          <span id="finger-label" class="finger-label"></span>
          <button id="btn-blind-mode" class="btn-secondary">🙈 מצב הקלדה עיוורת</button>
        </div>
        <div class="keyboard" id="keyboard" dir="ltr"></div>

        <div class="hands-container" id="hands-container">
          <!-- Left hand: thumb on right, pinky on left -->
          <svg class="hand-svg" id="hand-left" viewBox="0 0 130 205" xmlns="http://www.w3.org/2000/svg">
            <text x="65" y="14" class="hand-label" text-anchor="middle">יד שמאל</text>
            <rect x="18" y="122" width="92" height="66" rx="14" class="hand-palm"/>
            <rect class="hand-finger" data-zone="l-pinky"  x="18" y="80"  width="18" height="50" rx="9"/>
            <rect class="hand-finger" data-zone="l-ring"   x="40" y="60"  width="18" height="70" rx="9"/>
            <rect class="hand-finger" data-zone="l-middle" x="62" y="52"  width="18" height="78" rx="9"/>
            <rect class="hand-finger" data-zone="l-index"  x="84" y="58"  width="18" height="72" rx="9"/>
            <ellipse class="hand-finger" data-zone="thumb" cx="113" cy="145" rx="11" ry="21" transform="rotate(-28 113 145)"/>
          </svg>
          <!-- Right hand: thumb on left, pinky on right -->
          <svg class="hand-svg" id="hand-right" viewBox="0 0 130 205" xmlns="http://www.w3.org/2000/svg">
            <text x="65" y="14" class="hand-label" text-anchor="middle">יד ימין</text>
            <rect x="20" y="122" width="92" height="66" rx="14" class="hand-palm"/>
            <rect class="hand-finger" data-zone="r-index"  x="28" y="58"  width="18" height="72" rx="9"/>
            <rect class="hand-finger" data-zone="r-middle" x="50" y="52"  width="18" height="78" rx="9"/>
            <rect class="hand-finger" data-zone="r-ring"   x="72" y="60"  width="18" height="70" rx="9"/>
            <rect class="hand-finger" data-zone="r-pinky"  x="94" y="80"  width="18" height="50" rx="9"/>
            <ellipse class="hand-finger" data-zone="thumb" cx="17" cy="145" rx="11" ry="21" transform="rotate(28 17 145)"/>
          </svg>
        </div>
      </div>
    </section>
  </main>

  <script src="js/lessons.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
