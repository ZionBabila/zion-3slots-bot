<!DOCTYPE html>
<html lang="he" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unity C# Typing Practice</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">

    <!-- Sidebar -->
    <aside class="sidebar">
        <div class="sidebar-header">
            <h1>Unity C# &#x2328;</h1>
            <p>Typing Practice</p>
        </div>
        <div class="lesson-list" id="lesson-list"></div>
    </aside>

    <!-- Main -->
    <main class="main">

        <!-- Stats Bar -->
        <div class="stats-bar">
            <div class="stat">
                <span class="stat-value" id="wpm">0</span>
                <span class="stat-label">WPM</span>
            </div>
            <div class="stat">
                <span class="stat-value" id="accuracy">100%</span>
                <span class="stat-label">&#x05D3;&#x05D9;&#x05D5;&#x05E7;</span>
            </div>
            <div class="stat">
                <span class="stat-value" id="timer">0:00</span>
                <span class="stat-label">&#x05D6;&#x05DE;&#x05DF;</span>
            </div>
            <div class="stat">
                <span class="stat-value" id="progress-pct">0%</span>
                <span class="stat-label">&#x05D4;&#x05EA;&#x05E7;&#x05D3;&#x05DE;&#x05D5;&#x05EA;</span>
            </div>
        </div>

        <!-- Lesson Header -->
        <div class="lesson-header">
            <div class="lesson-meta">
                <span class="lesson-category" id="lesson-category"></span>
                <h2 class="lesson-title" id="lesson-title"></h2>
                <p class="lesson-desc" id="lesson-desc"></p>
                <div class="difficulty-stars" id="difficulty-stars"></div>
                <span id="lesson-type-badge" class="lesson-type-label type-api"></span>
            </div>
            <div class="lesson-controls">
                <button id="btn-restart" class="btn btn-secondary">&#x21BA; &#x05DE;&#x05D7;&#x05D3;&#x05E9;</button>
                <button id="btn-next" class="btn btn-primary">&#x05D4;&#x05D1;&#x05D0; &#x203A;</button>
            </div>
        </div>

        <!-- Progress Bar -->
        <div class="progress-bar">
            <div class="progress-fill" id="progress-fill"></div>
        </div>

        <!-- Code Display -->
        <div class="code-container" id="code-container">
            <div class="code-display" id="code-display"></div>
        </div>

        <!-- Hint -->
        <div class="hint" id="hint">&#x05DC;&#x05D7;&#x05E5; &#x05E2;&#x05DC; &#x05DE;&#x05E7;&#x05E9; &#x05DB;&#x05DC;&#x05E9;&#x05D4;&#x05D5; &#x05DC;&#x05D4;&#x05EA;&#x05D7;&#x05DC;&#x05D4;</div>

        <!-- Completion Overlay -->
        <div class="completion" id="completion">
            <div class="completion-card">
                <h2>&#x2713; &#x05E9;&#x05D9;&#x05E2;&#x05D5;&#x05E8; &#x05D4;&#x05D5;&#x05E9;&#x05DC;&#x05DD;!</h2>
                <div class="completion-stars" id="final-stars">&#x2606;&#x2606;&#x2606;</div>
                <div class="completion-stats">
                    <div class="completion-stat">
                        <span class="completion-value" id="final-wpm">0</span>
                        <span class="completion-label">WPM</span>
                    </div>
                    <div class="completion-stat">
                        <span class="completion-value" id="final-accuracy">100%</span>
                        <span class="completion-label">&#x05D3;&#x05D9;&#x05D5;&#x05E7;</span>
                    </div>
                    <div class="completion-stat">
                        <span class="completion-value" id="final-time">0:00</span>
                        <span class="completion-label">&#x05D6;&#x05DE;&#x05DF;</span>
                    </div>
                </div>
                <div class="completion-buttons">
                    <button id="btn-completion-retry" class="btn btn-secondary">&#x21BA; &#x05E9;&#x05D5;&#x05D1;</button>
                    <button id="btn-completion-next" class="btn btn-primary">&#x05D4;&#x05D1;&#x05D0; &#x203A;</button>
                </div>
            </div>
        </div>

    </main>
</div>

<!-- Lesson packs — add new packs by adding a <script> here -->
<script src="lessons/api/lessons-api.js"></script>
<script src="lessons/shell-bound/lessons-shell-bound.js"></script>
<script src="lessons/examples/lessons-examples.js"></script>
<script src="lessons-loader.js"></script>
<script src="app.js"></script>
</body>
</html>
